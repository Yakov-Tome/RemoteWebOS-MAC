<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>שלט LG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-power" viewBox="0 0 24 24">
      <path d="M12 3v9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M7.1 6.6a7 7 0 1 0 9.8 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24">
      <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2M8.5 21.5h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-input" viewBox="0 0 24 24">
      <path d="M4 8h12l-3.2-3.2M20 16H8l3.2 3.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-minus" viewBox="0 0 24 24">
      <path d="M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-mute" viewBox="0 0 24 24">
      <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/>
      <path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24">
      <path d="M5 15l7-7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M10 6L4 12l6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 12h10a6 6 0 0 1 0 12h-2" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" d="M10.4 2h3.2l.42 2.26 1.5.62 1.86-1.34 2.26 2.26-1.34 1.86.62 1.5L21.2 9.6v3.2l-2.26.42-.62 1.5 1.34 1.86-2.26 2.26-1.86-1.34-1.5.62L13.6 20.4h-3.2l-.42-2.26-1.5-.62L6.62 18.9 4.36 16.64 5.7 14.78l-.62-1.5L2.8 12.8V9.6l2.28-.42.62-1.5L4.36 5.82 6.62 3.56 8.48 4.9l1.5-.62zM12 8.9a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2z"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 4.5h3.5v15H7.5zM13 4.5h3.5v15H13z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-rew" viewBox="0 0 24 24"><path d="M12 5.5v13L4 12zM21 5.5v13L13 12z" fill="currentColor"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5.5v13l8-6.5zM3 5.5v13l8-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.6" fill="currentColor"/>
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.6" fill="currentColor"/>
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.6" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="7" height="7" rx="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="stage">
    <div class="led-bar">
      <span id="led" class="led"></span>
      <span id="status">מתחבר...</span>
    </div>

    <!-- The remote body mirrors the LG Magic Remote, so it stays LTR like the hardware. -->
    <div class="remote" dir="ltr">
      <div class="brand">LG</div>

      <div class="top-row">
        <button class="key round power" id="powerKey" title="הדלקה / כיבוי" aria-label="הדלקה או כיבוי">
          <svg><use href="#i-power"/></svg>
        </button>
        <button class="key round" data-sheet="toast" title="שלח הודעה לטלוויזיה" aria-label="שלח הודעה לטלוויזיה">
          <svg><use href="#i-mic"/></svg>
        </button>
        <button class="key round" data-sheet="inputs" title="בחירת מקור" aria-label="בחירת מקור">
          <svg><use href="#i-input"/></svg>
        </button>
      </div>

      <div class="numpad">
        <button class="key num" data-cmd="POST /api/button/1" data-repeat="0">1</button>
        <button class="key num" data-cmd="POST /api/button/2" data-repeat="0">2</button>
        <button class="key num" data-cmd="POST /api/button/3" data-repeat="0">3</button>
        <button class="key num" data-cmd="POST /api/button/4" data-repeat="0">4</button>
        <button class="key num" data-cmd="POST /api/button/5" data-repeat="0">5</button>
        <button class="key num" data-cmd="POST /api/button/6" data-repeat="0">6</button>
        <button class="key num" data-cmd="POST /api/button/7" data-repeat="0">7</button>
        <button class="key num" data-cmd="POST /api/button/8" data-repeat="0">8</button>
        <button class="key num" data-cmd="POST /api/button/9" data-repeat="0">9</button>
        <button class="key num small" data-cmd="POST /api/button/CC" title="כתוביות">CC</button>
        <button class="key num" data-cmd="POST /api/button/0">0</button>
        <button class="key num small" data-cmd="POST /api/button/DASH" title="מקף">—</button>
      </div>

      <div class="rockers">
        <div class="rocker">
          <button class="key rock-up" data-cmd="POST /api/volume/up" data-repeat="1" aria-label="עוצמה למעלה">
            <svg><use href="#i-plus"/></svg>
          </button>
          <span class="rock-label">VOL</span>
          <button class="key rock-down" data-cmd="POST /api/volume/down" data-repeat="1" aria-label="עוצמה למטה">
            <svg><use href="#i-minus"/></svg>
          </button>
        </div>

        <div class="mid-keys">
          <button class="key round mute" data-cmd="POST /api/mute/toggle" title="השתקה" aria-label="השתקה">
            <svg><use href="#i-mute"/></svg>
          </button>
          <button class="key round" data-sheet="apps" title="כל האפליקציות" aria-label="כל האפליקציות">
            <svg><use href="#i-grid"/></svg>
          </button>
        </div>

        <div class="rocker">
          <button class="key rock-up" data-cmd="POST /api/channel/up" data-repeat="1" aria-label="ערוץ למעלה">
            <svg><use href="#i-plus"/></svg>
          </button>
          <span class="rock-label">CH</span>
          <button class="key rock-down" data-cmd="POST /api/channel/down" data-repeat="1" aria-label="ערוץ למטה">
            <svg><use href="#i-minus"/></svg>
          </button>
        </div>
      </div>

      <div class="wheel-wrap">
        <div class="wheel">
          <button class="seg seg-up" data-cmd="POST /api/button/UP" data-repeat="1" aria-label="למעלה">
            <svg><use href="#i-up"/></svg>
          </button>
          <button class="seg seg-right" data-cmd="POST /api/button/RIGHT" data-repeat="1" aria-label="ימינה">
            <svg><use href="#i-up"/></svg>
          </button>
          <button class="seg seg-down" data-cmd="POST /api/button/DOWN" data-repeat="1" aria-label="למטה">
            <svg><use href="#i-up"/></svg>
          </button>
          <button class="seg seg-left" data-cmd="POST /api/button/LEFT" data-repeat="1" aria-label="שמאלה">
            <svg><use href="#i-up"/></svg>
          </button>
          <button class="ok" data-cmd="POST /api/button/ENTER" aria-label="אישור">OK</button>
        </div>
      </div>

      <div class="nav-row">
        <button class="key round" data-cmd="POST /api/button/BACK" title="חזרה" aria-label="חזרה">
          <svg><use href="#i-back"/></svg>
        </button>
        <button class="key round" data-cmd="POST /api/button/HOME" title="בית" aria-label="בית">
          <svg><use href="#i-home"/></svg>
        </button>
        <button class="key round" data-cmd="POST /api/button/MENU" title="הגדרות" aria-label="הגדרות">
          <svg><use href="#i-gear"/></svg>
        </button>
      </div>

      <div class="nav-row thin">
        <button class="key pill" data-cmd="POST /api/button/INFO">INFO</button>
        <button class="key pill" data-cmd="POST /api/button/EXIT">EXIT</button>
        <button class="key pill" data-cmd="POST /api/button/ASTERISK">✻</button>
      </div>

      <div class="media-row">
        <button class="key round sm" data-cmd="POST /api/media/rewind" aria-label="אחורה"><svg><use href="#i-rew"/></svg></button>
        <button class="key round sm" data-cmd="POST /api/media/play" aria-label="נגן"><svg><use href="#i-play"/></svg></button>
        <button class="key round sm" data-cmd="POST /api/media/pause" aria-label="השהה"><svg><use href="#i-pause"/></svg></button>
        <button class="key round sm" data-cmd="POST /api/media/stop" aria-label="עצור"><svg><use href="#i-stop"/></svg></button>
        <button class="key round sm" data-cmd="POST /api/media/forward" aria-label="קדימה"><svg><use href="#i-fwd"/></svg></button>
      </div>

      <div id="hotkeys" class="hotkeys"></div>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button id="sheetClose" class="key round sm" aria-label="סגור"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
